name = "ticketplus-check"
main = "worker.js"
compatibility_date = "2026-10-20"
workers_dev = true
keep_vars = true

# The only non-secret activation flag; encrypted Telegram credentials
# remain set privately in Cloudflare Dashboard.
[vars]
MONITOR_ENABLED = "true"

# Previous states and notification deduplication: Cloudflare free Workers KV.
[[kv_namespaces]]
binding = "TICKET_STATE"

# Every five minutes, entirely within Cloudflare (not GitHub Actions).
[triggers]
crons = ["*/5 * * * *"]
