name: One-time safe Ticket Plus browser probe
on:
  issues:
    types: [opened]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  smoke:
    if: (github.event_name == 'issues' && github.event.issue.title == 'ticketplus-safe-probe-20261019') || (github.event_name == 'push' && contains(github.event.head_commit.message, 'ticketplus-safe-smoke-trigger'))
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Browser-only site probe (no Telegram)
        run: python -m src.ticket_watch --mode probe
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: ticketplus-live-probe
          path: diagnostics/
          if-no-files-found: error
          retention-days: 1
