name: One-time read-only public activity row inspection
on:
  push:
    paths:
      - '.github/workflows/activity-row-probe.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Inspect event rows without login
        run: python -m scripts.activity_status_probe
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: public-activity-row-screenshots
          path: diagnostics/activity-*.png
          retention-days: 2
