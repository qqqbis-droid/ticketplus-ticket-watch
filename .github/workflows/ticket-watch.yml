name: Ticket Plus activity page watcher (not yet activated)
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'probe = inspect only; monitor requires verified public page and Telegram secrets'
        type: choice
        options: [probe, monitor]
        default: probe
permissions:
  contents: write
concurrency:
  group: ticketplus-activity-watch
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Read public activity page only
        env:
          PUBLIC_ACTIVITY_VERIFIED: ${{ vars.PUBLIC_ACTIVITY_VERIFIED }}
          MONITOR_ENABLED: ${{ vars.MONITOR_ENABLED }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MODE: ${{ github.event.inputs.mode }}
        run: python -m src.public_activity --mode "$MODE"
      - name: Save probe (no push messages)
        if: github.event.inputs.mode == 'probe'
        uses: actions/upload-artifact@v4
        with:
          name: public-activity-status
          path: diagnostics/public-activity.json
          retention-days: 3
      - name: Commit deduplication state (only after verified monitoring)
        if: success() && github.event.inputs.mode == 'monitor'
        run: |
          if [ -n "$(git status --porcelain -- state/activity_state.json)" ]; then
            git config user.name "ticketplus-monitor-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state/activity_state.json
            git commit -m "chore: update activity alert state [skip ci]"
            git push
          fi
