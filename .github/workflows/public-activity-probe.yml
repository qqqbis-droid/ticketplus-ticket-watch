name: One-time public activity availability probe
on:
  issues:
    types: [opened]
permissions:
  contents: read
jobs:
  probe:
    if: github.event.issue.title == 'ticketplus-public-activity-probe-20261019'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Read public event page without login
        run: python scripts/public_activity_probe.py
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: public-activity-probe
          path: diagnostics/activity.png
          retention-days: 1
