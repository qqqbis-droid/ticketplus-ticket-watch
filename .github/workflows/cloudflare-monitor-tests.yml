name: Cloudflare monitor offline safety tests
on:
  push:
    paths:
      - 'cloudflare-probe/**'
      - '.github/workflows/cloudflare-monitor-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate six sale-states and Telegram deduplication offline
        run: node --test cloudflare-probe/tests/monitor.test.js
