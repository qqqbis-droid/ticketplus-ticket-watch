name: One-time iPhone-like public activity site check
on:
  push:
    paths:
      - '.github/workflows/mobile-probe.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Read public activity cards using mobile-sized browser; no purchases or notifications
        env:
          TICKETPLUS_MOBILE_EMULATION: '1'
        run: python -m src.public_activity --mode probe
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: iphone-like-site-probe
          path: diagnostics/public-activity.json
          retention-days: 2
