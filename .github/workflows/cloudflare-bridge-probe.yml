name: One-time Cloudflare bridge test
on:
  push:
    paths: ['.github/workflows/cloudflare-bridge-probe.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Cloudflare data availability from GitHub
        run: python -m scripts.cloudflare_bridge_probe
