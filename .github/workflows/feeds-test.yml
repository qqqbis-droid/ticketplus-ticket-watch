name: One-time public announcement feeds check
on:
  push:
    paths: ['.github/workflows/feeds-test.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test read-only public feeds without Telegram
        run: python -m scripts.feeds_test
